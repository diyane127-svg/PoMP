  ================================================================== */
  function privacyModal() {
    openModal([
      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="pv-title">',
      '<div class="modal-icon" style="background:var(--accent-soft); color:#6B2C91">' + ICON_LOCK + '</div>',
      '<h2 id="pv-title">Bevor du startest</h2>',
      '<p>Deine Dateien werden <strong>nur lokal auf diesem Gerät</strong> gespeichert – im Browser, nicht auf einem Server. ',
      'Für die Analyse gehen die Seiten direkt an Google Gemini, mit deinem eigenen Schlüssel. Er wird nicht gespeichert und nicht protokolliert.</p>',
      '<div class="modal-actions">',
      '<button class="btn btn-ghost" data-action="cancel-modal">Abbrechen</button>',
      '<button class="btn btn-primary" data-action="privacy-accept" data-autofocus>Verstanden, hochladen</button>',
      '</div>',
      '</div>'
    ].join(''));
  }

  async function handleFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []).filter(Boolean);
    if (!files.length) return;
    if (!S.settings.gemini_key) {
      toast('Bitte Gemini-Schlüssel in den Einstellungen eintragen.', 'error');
      go('settings');
      return;
    }
    var ack = false;
    try { ack = localStorage.getItem(PRIVACY_KEY) === '1'; } catch (e) {}
    if (!ack) {
      S.pendingFiles = files;
      privacyModal();
      return;
    }
    await acceptFiles(files);
  }

  async function acceptFiles(files) {
    if (!S.settings.gemini_key) {
      toast('Bitte Gemini-Schlüssel in den Einstellungen eintragen.', 'error');
      go('settings');
      return;
    }
    var accepted = 0;
    for (var i = 0; i < files.length; i++) {
      var file = files[i];
      try {
        var meta = await validateFile(file);
        var rec = {
          upload_id: uid('upl'),
          session_id: S.session,
          name: file.name || 'Hausaufgabe',
          mime: meta.mime,
          kind: meta.kind,
          pages: meta.pages,
          size: file.size,
          created_at: nowIso(),
          status: 'analyzing',
          error: null,
          file: file
        };
        await idbPut('uploads', rec);
        S.uploads.unshift(rec);
        S.analyzing[rec.upload_id] = true;
        accepted++;
        render();
        analyzeUpload(rec);
      } catch (err) {
        toast(errText(err), 'error');
      }
    }
    if (accepted) {
      toast(accepted === 1 ? 'Datei hochgeladen. Die Analyse läuft.' : accepted + ' Dateien hochgeladen. Die Analysen laufen.', 'success');
    }
  }

  async function retryAnalysis(uploadId) {
    var upload = findUpload(uploadId);
    if (!upload) return;
    if (!upload.file) {
      toast('Die Datei ist nicht mehr vorhanden. Bitte lösche den Upload und lade sie erneut.', 'error');
      return;
    }
    upload.status = 'analyzing';
    upload.error = null;
    try { await idbPut('uploads', upload); } catch (e) {}
    S.analyzing[uploadId] = true;
    render();
    analyzeUpload(upload);
  }

  function openUpload(uploadId) {
    var upload = findUpload(uploadId);
    if (!upload) return;
    S.uploadId = uploadId;
    S.reviewStepId = null;
    var analysis = S.analyses[uploadId];
    if (!analysis) { S.view = 'pyramid'; S.subtaskId = null; render(); scrollTop(); return; }

    var stats = uploadStats(uploadId, analysis);
    if (stats.complete) {
      S.view = 'summary';
      render();
      scrollTop();
      if (!S.summaries[uploadId] && !S.summaryInFlight[uploadId]) generateSummary(uploadId);
      return;
    }
    var entries = allSubtasks(analysis);
    var next = null;
    for (var i = 0; i < entries.length; i++) {
      if (!subtaskDone(uploadId, entries[i].subtask)) { next = entries[i]; break; }
    }
    S.subtaskId = next ? next.subtask.id : (entries[0] ? entries[0].subtask.id : null);
    S.view = 'pyramid';
    render();
    scrollTop();
  }

  function scrollTop() {
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  /* ==================================================================
     Löschen
  ================================================================== */
  function askDelete(uploadId) {
    var upload = findUpload(uploadId);
    if (!upload) return;
    openModal([
      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="del-title">',
      '<div class="modal-icon">' + ICON_TRASH + '</div>',
      '<h2 id="del-title">Upload endgültig löschen?</h2>',
      '<p>„' + esc(upload.name) + '“ wird mit Datei, Pyramidenschritten, Hinweisen, Fortschritt und Zusammenfassung von diesem Gerät entfernt. Das lässt sich nicht rückgängig machen.</p>',
      '<div class="modal-actions">',
      '<button class="btn btn-secondary" data-action="cancel-modal" data-autofocus>Abbrechen</button>',
      '<button class="btn btn-danger" data-action="confirm-delete" data-upload="' + esc(uploadId) + '">Endgültig löschen</button>',
      '</div>',
      '</div>'
    ].join(''));
  }

  async function deleteUpload(uploadId) {
    closeModal();
    try {
      var keys = Object.keys(S.progress).filter(function (k) { return S.progress[k].upload_id === uploadId; });
      for (var i = 0; i < keys.length; i++) {
        await idbDelete('progress', keys[i]);
        delete S.progress[keys[i]];
      }
      await idbDelete('analyses', uploadId);
      await idbDelete('summaries', uploadId);
      await idbDelete('uploads', uploadId);

      delete S.analyses[uploadId];
      delete S.summaries[uploadId];
      delete S.analyzing[uploadId];
      S.uploads = S.uploads.filter(function (u) { return u.upload_id !== uploadId; });

      if (S.uploadId === uploadId) {
        S.uploadId = null;
        S.subtaskId = null;
        S.reviewStepId = null;
        if (S.view !== 'list') S.view = 'list';
      }
      toast('Upload endgültig gelöscht.', 'success');
      render();
    } catch (err) {
      toast('Löschen fehlgeschlagen: ' + errText(err), 'error');
    }
  }

  function askDeleteAll() {
    openModal([
      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="delall-title">',
      '<div class="modal-icon">' + ICON_TRASH + '</div>',
      '<h2 id="delall-title">Alle Hausaufgaben löschen?</h2>',
      '<p>Alle Uploads, Pyramiden, Hinweise, Fortschritte und Zusammenfassungen auf diesem Gerät werden entfernt. Dein Gemini-Schlüssel bleibt in den Einstellungen gespeichert.</p>',
      '<div class="modal-actions">',
      '<button class="btn btn-secondary" data-action="cancel-modal" data-autofocus>Abbrechen</button>',
      '<button class="btn btn-danger" data-action="confirm-delete-all">Endgültig löschen</button>',
      '</div>',
      '</div>'
    ].join(''));
  }

  async function deleteAllUploads() {
    closeModal();
    try {
      var db = await openDb();
      var stores = ['uploads', 'analyses', 'progress', 'summaries'];
      for (var i = 0; i < stores.length; i++) {
        await new Promise(function (resolve, reject) {
          var t = db.transaction(stores[i], 'readwrite');
          t.objectStore(stores[i]).clear();
          t.oncomplete = resolve;
          t.onerror = function () { reject(t.error); };
        });
      }
      S.uploads = [];
      S.analyses = {};
      S.progress = {};
      S.summaries = {};
      S.uploadId = null;
      S.subtaskId = null;
      S.view = 'list';
      toast('Alle Hausaufgaben wurden gelöscht.', 'success');
      render();
    } catch (err) {
      toast('Löschen fehlgeschlagen: ' + errText(err), 'error');
    }
  }

  async function testKey(button) {
    var input = $('#key-input');
    var typed = input ? input.value.trim() : '';
    if (typed && typed !== S.settings.gemini_key) {
      S.settings.gemini_key = typed;
      try { await setSetting('gemini_key', typed); } catch (e) {}
    }
    var old = button.innerHTML;
    button.disabled = true;
    button.innerHTML = '<span class="spinner"></span> Verbindung wird geprüft …';
    try {
      var r = await geminiRequest({
        parts: [{ text: 'Antworte ausschließlich mit dem Wort OK.' }],
        maxOutputTokens: 200,
        temperature: 0
      });
      toast('Verbindung steht (' + r.model + ').', 'success');
    } catch (err) {
      toast(errText(err), 'error');
    } finally {
      button.disabled = false;
      button.innerHTML = old;
    }
  }

  /* ==================================================================
     Aktionen
  ================================================================== */
  async function handleAction(action, el) {
    var uploadId = el ? el.getAttribute('data-upload') : null;

    switch (action) {
      case 'go-list':
        S.view = 'list';
        S.uploadId = null;
        S.subtaskId = null;
        S.reviewStepId = null;
        render();
        scrollTop();
        return;

      case 'go-settings':
        S.view = 'settings';
        render();
        scrollTop();
        return;

      case 'upload':
        var input = $('#file-input');
        if (input) input.click();
        return;

      case 'privacy-accept':
        try { localStorage.setItem(PRIVACY_KEY, '1'); } catch (e) {}
        closeModal();
        if (S.pendingFiles && S.pendingFiles.length) {
          var pending = S.pendingFiles;
          S.pendingFiles = null;
          await acceptFiles(pending);
        }
        return;

      case 'open-upload':
        openUpload(uploadId);
        return;

      case 'retry':
        await retryAnalysis(uploadId);
        return;

      case 'ask-delete':
        askDelete(uploadId);
        return;

      case 'confirm-delete':
        await deleteUpload(uploadId);
        return;

      case 'ask-delete-all':
        askDeleteAll();
        return;

      case 'confirm-delete-all':
        await deleteAllUploads();
        return;

      case 'cancel-modal':
        closeModal();
        return;

      case 'open-subtask':
        S.subtaskId = el.getAttribute('data-subtask');
        S.reviewStepId = null;
        render();
        scrollTop();
        return;

      case 'resume-upload':
        openUpload(S.uploadId);
        return;

      case 'review-step':
        var stepId = el.getAttribute('data-step');
        S.reviewStepId = S.reviewStepId === stepId ? null : stepId;
        render();
        return;

      case 'close-review':
        S.reviewStepId = null;
        render();
        return;

      case 'hint': {
        var ctxHint = currentContext();
        if (!ctxHint || !ctxHint.step) return;
        await requestHint(ctxHint.upload, ctxHint.task, ctxHint.subtask, ctxHint.step, ctxHint.p);
        return;
      }

      case 'check-answer': {
        var ctxCheck = currentContext();
        if (!ctxCheck || !ctxCheck.step) return;
        var area = document.querySelector('[data-answer-input]');
        var text = area ? area.value.trim() : (S.draft[ctxCheck.step.id] || '');
        if (!text) { toast('Bitte schreibe zuerst deine Lösung auf.'); if (area) area.focus(); return; }
        S.draft[ctxCheck.step.id] = text;
        ctxCheck.rec.text = text;
        ctxCheck.rec.phase = 'check';
        ctxCheck.rec.updated_at = nowIso();
        await saveProgress(ctxCheck.p);
        render();
        return;
      }

      case 'verdict-right': {
        var ctxRight = currentContext();
        if (!ctxRight || !ctxRight.step) return;
        ctxRight.rec.verdict = 'right';
        ctxRight.rec.phase = 'done';
        ctxRight.rec.updated_at = nowIso();
        await saveProgress(ctxRight.p);
        render();
        return;
      }

      case 'verdict-wrong': {
        var ctxWrong = currentContext();
        if (!ctxWrong || !ctxWrong.step) return;
        ctxWrong.rec.verdict = 'wrong';
        ctxWrong.rec.attempts = (ctxWrong.rec.attempts || 0) + 1;
        ctxWrong.rec.text = '';
        ctxWrong.rec.updated_at = nowIso();
        delete S.draft[ctxWrong.step.id];
        if (ctxWrong.rec.attempts >= 2) {
          ctxWrong.rec.phase = 'revealed';
        } else {
          ctxWrong.rec.phase = 'retry';
        }
        await saveProgress(ctxWrong.p);
        render();
        return;
      }

      case 'next-step': {
        var ctxNext = currentContext();
        if (!ctxNext || !ctxNext.step) return;
        var total = ctxNext.subtask.steps.length;
        if (ctxNext.p.current < total) ctxNext.p.current += 1;
        if (ctxNext.p.current >= total) ctxNext.p.done = true;
        delete S.draft[ctxNext.step.id];
        S.reviewStepId = null;
        await saveProgress(ctxNext.p);
        render();
        scrollTop();
        if (ctxNext.p.done) await checkSummaryIfComplete(ctxNext.upload.upload_id);
        return;
      }

      case 'search-sources': {
        var ctxSrc = currentContext();
        if (!ctxSrc) return;
        await searchSources(ctxSrc.analysis, ctxSrc.task, ctxSrc.subtask);
        return;
      }

      case 'open-summary':
        S.uploadId = uploadId || S.uploadId;
        S.view = 'summary';
        render();
        scrollTop();
        if (S.uploadId) {
          var an = S.analyses[S.uploadId];
          var stats = an ? uploadStats(S.uploadId, an) : null;
          if (stats && stats.complete && !S.summaries[S.uploadId] && !S.summaryInFlight[S.uploadId]) {
            generateSummary(S.uploadId);
          }
        }
        return;

      case 'create-summary':
        if (S.uploadId) await generateSummary(S.uploadId);
        return;

      case 'download-pdf':
        if (S.uploadId) await exportPdf(S.uploadId, el);
        return;

      case 'download-jpg':
        if (S.uploadId) await exportJpg(S.uploadId, el);
        return;

      case 'toggle-practice': {
        var key = el.getAttribute('data-key');
        S.showPractice[key] = !S.showPractice[key];
        render();
        return;
      }

      case 'save-key':
        await saveKey();
        return;

      case 'toggle-key':
        S.showKey = !S.showKey;
        render();
        return;

      case 'test-key':
        await testKey(el);
        return;

      case 'ask-clear-key':
        askClearKey();
        return;

      case 'confirm-clear-key':
        await clearKey();
        return;

      default:
        return;
    }
  }

  /* ==================================================================
     Events
  ================================================================== */
  function wireEvents() {
    document.addEventListener('click', function (e) {
      var el = e.target && e.target.closest ? e.target.closest('[data-action]') : null;
      if (!el) return;
      var action = el.getAttribute('data-action');
      if (action === 'backdrop') {
        if (e.target === el) closeModal();
        return;
      }
      if (action === 'cancel-modal') {
        e.preventDefault();
        closeModal();
        return;
      }
      e.preventDefault();
      Promise.resolve(handleAction(action, el)).catch(function (err) {
        console.error(err);
        toast(errText(err), 'error');
      });
    });

    document.addEventListener('input', function (e) {
      var t = e.target;
      if (!t || !t.matches) return;
      if (t.matches('[data-answer-input]')) {
        S.draft[t.getAttribute('data-answer-input')] = t.value;
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modalOpen()) {
        e.preventDefault();
        closeModal();
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        var target = e.target;
        if (target && target.matches && target.matches('[data-answer-input]')) {
          e.preventDefault();
          Promise.resolve(handleAction('check-answer', target)).catch(function (err) { toast(errText(err), 'error'); });
        }
      }
    });

    var fileInput = $('#file-input');
    if (fileInput) {
      fileInput.addEventListener('change', function () {
        var files = Array.prototype.slice.call(fileInput.files || []);
        fileInput.value = '';
        handleFiles(files).catch(function (err) { toast(errText(err), 'error'); });
      });
    }

    document.addEventListener('dragover', function (e) {
      if (S.view !== 'list') return;
      if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) {
        e.preventDefault();
      }
    });

    document.addEventListener('drop', function (e) {
      if (S.view !== 'list') return;
      if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
      e.preventDefault();
      handleFiles(e.dataTransfer.files).catch(function (err) { toast(errText(err), 'error'); });
    });
  }

  /* ==================================================================
     Start
  ================================================================== */
  async function loadState() {
    var uploads = await idbAll('uploads');
    S.uploads = uploads
      .filter(function (u) { return u && u.session_id === S.session; })
      .sort(function (a, b) { return String(b.created_at).localeCompare(String(a.created_at)); });

    var ids = {};
    S.uploads.forEach(function (u) { ids[u.upload_id] = true; });

    var analyses = await idbAll('analyses');
    S.analyses = {};
    analyses.forEach(function (a) {
      if (a && ids[a.upload_id]) S.analyses[a.upload_id] = a;
    });

    var progress = await idbAll('progress');
    S.progress = {};
    progress.forEach(function (p) {
      if (p && p.id && ids[p.upload_id]) S.progress[p.id] = p;
    });

    var summaries = await idbAll('summaries');
    S.summaries = {};
    summaries.forEach(function (s) {
      if (s && ids[s.upload_id]) S.summaries[s.upload_id] = s;
    });

    for (var i = 0; i < S.uploads.length; i++) {
      var u = S.uploads[i];
      if (u.status === 'analyzing' && S.analyses[u.upload_id]) {
        u.status = 'ready';
        try { await idbPut('uploads', u); } catch (e) {}
      } else if (u.status === 'analyzing' && !S.analyzing[u.upload_id]) {
        u.status = 'error';
        u.error = 'Die Analyse wurde unterbrochen. Bitte erneut versuchen.';
        try { await idbPut('uploads', u); } catch (e) {}
      }
    }
  }

  async function init() {
    S.session = getSessionId();
    S.showKey = false;

    if (window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    try {
      await openDb();
      S.settings.gemini_key = await getApiKey();
      S.settings.gemini_model = await getModel();
      await loadState();
    } catch (err) {
      console.error(err);
      S.bootError = errText(err) + ' Bitte prüfe, ob dein Browser lokale Speicherung im privaten Modus erlaubt.';
    }

    wireEvents();
    render();
  }

  init();
})();
</script>
